<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Welcome to My Portfolio</h1>
        <p>Software Engineer & Designer</p>
    </header>

    <main class="portfolio-container">
        <!-- Tab Navigation Buttons -->
        <nav class="tab-navigation">
            <button class="tab-btn active" onclick="openTab(event, 'about')">About Me</button>
            <button class="tab-btn" onclick="openTab(event, 'projects')">Projects</button>
            <button class="tab-btn" onclick="openTab(event, 'skills')">Skills</button>
        </nav>

        <!-- Tab Content Areas -->
        <section id="about" class="tab-content active-content">
            <h2>About Me</h2>
            <p>Hello! I am a passionate developer focused on building clean, user-friendly web applications.</p>
        </section>

        <section id="projects" class="tab-content">
            <h2>Featured Projects</h2>
            <p>Here are some of my top repositories hosted on GitHub.</p>
        </section>

        <section id="skills" class="tab-content">
            <h2>Technical Skills</h2>
            <p>JavaScript, Python, React, Git, and Docker.</p>
        </section>
    </main>

    <!-- JavaScript to Handle Tab Switching -->
    <script>
        function openTab(evt, tabName) {
            // Hide all tab content
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active-content'));

            // Remove 'active' class from all buttons
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Show current tab content and highlight the button
            document.getElementById(tabName).classList.add('active-content');
            evt.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
